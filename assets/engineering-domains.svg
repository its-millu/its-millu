<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
<title id="t">Engineering domains</title><desc id="d">Four colorful connected disciplines: artificial intelligence, robotics, embedded and IoT, and UAV systems.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0B1029"/><stop offset="1" stop-color="#102C43"/></linearGradient><linearGradient id="edge" x2="1"><stop stop-color="#48E5FF"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#FF8A72"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.ey{font-size:13px;letter-spacing:3px;font-weight:800;fill:#8BEAF5}.h{font-size:23px;font-weight:800;fill:#F2F4FF}.p{font-size:13px;fill:#AAB8DD}.n{font-size:11px;letter-spacing:2px;fill:#7D91C1}.card{fill:#151D3B;stroke:#384A78;stroke-width:1.2}.line{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.signal{stroke-dasharray:5 12;animation:dash 5s linear infinite}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes dash{to{stroke-dashoffset:-136}}@keyframes pulse{50%{opacity:.45;filter:drop-shadow(0 0 7px currentColor)}}@media(prefers-reduced-motion:reduce){.signal,.pulse{animation:none}}</style></defs>
<rect width="1200" height="360" rx="25" fill="url(#bg)"/>
<circle cx="600" cy="180" r="160" fill="#7C3AED" opacity=".07"/>
<text x="42" y="42" class="ey">THE SYSTEMS I’M EXPLORING</text><text x="1158" y="42" class="n" text-anchor="end">FOUR CONNECTED DISCIPLINES</text>
<path d="M170 190H1030" stroke="url(#edge)" stroke-width="2" opacity=".65" class="signal"/>
<!-- AI -->
