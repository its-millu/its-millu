<g transform="translate(135 77)" stroke="#A78BFA" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#g)"><path d="M-38 30h76M-20 30-8 4 17-12 31-34"/><circle cx="-8" cy="4" r="9" fill="#151D3B"/><circle cx="17" cy="-12" r="8" fill="#151D3B"/><path d="m31-34 12-3m-12 3 5-12m-5 12-10-8"/></g>
<text x="24" y="151" class="h">Robotics</text><text x="24" y="178" class="p">Motion · Control · Automation</text><text x="24" y="201" class="n">02 / MACHINES IN MOTION</text></g>
