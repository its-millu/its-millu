<g transform="translate(135 77)" stroke="#B7F36B" fill="none" stroke-width="2.5" filter="url(#g)"><rect x="-34" y="-34" width="68" height="68" rx="10"/><rect x="-13" y="-13" width="26" height="26" rx="4"/><path d="M-20-45v11m20-11v11m20-11v11M-20 34v11m20-11v11m20-11v11M-45-20h11m-11 20h11m-11 20h11M34-20h11m-11 20h11m-11 20h11"/></g>
<text x="24" y="151" class="h">Embedded &amp; IoT</text><text x="24" y="178" class="p">Sensors · Firmware · Connectivity</text><text x="24" y="201" class="n">03 / SOFTWARE MEETS HARDWARE</text></g>
