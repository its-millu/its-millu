<g transform="translate(135 77)" stroke="#48E5FF" fill="none" stroke-width="2.5" filter="url(#g)"><path d="M-35-18 0-37 35-18 35 20 0 39-35 20Z"/><path d="m-35-18 35 20 35-20M0 2v37M-35 20 0 2l35 18"/><circle r="6" fill="#48E5FF" class="pulse"/><circle cx="-35" cy="-18" r="4" fill="#48E5FF"/><circle cx="35" cy="-18" r="4" fill="#48E5FF"/></g>
<text x="24" y="151" class="h">Artificial Intelligence</text><text x="24" y="178" class="p">Machine learning · Computer vision</text><text x="24" y="201" class="n">01 / PERCEPTION &amp; LEARNING</text></g>
<!-- robotics -->
