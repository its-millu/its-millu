    <text class="name" x="55" y="35">FastAPI</text><text class="hint" x="55" y="52">API SERVICES</text>
  </g>
  <g transform="translate(850 250)">
    <rect class="tile" width="130" height="78" rx="12"/><rect class="icon-bg" x="12" y="13" width="34" height="34" rx="9"/>
    <path class="icon-line" d="M19 23q10-9 20 0v14q-10 9-20 0Z"/><path class="icon-line" d="M19 27q10 8 20 0M19 33q10 8 20 0"/>
    <text class="name" x="55" y="35">MongoDB</text><text class="hint" x="55" y="52">DATABASE</text>
  </g>
  <g transform="translate(992 250)">
    <rect class="tile" width="150" height="78" rx="12"/><rect class="icon-bg" x="12" y="13" width="34" height="34" rx="9"/>
    <circle class="icon-line" cx="29" cy="30" r="11"/><path class="icon-line" d="m23 30 4 4 8-9"/>
    <text class="name" x="55" y="35">Git</text><text class="hint" x="55" y="52">VERSION CONTROL</text>
  </g>
</g>

<!-- HARDWARE & ENGINEERING -->
<g class="float">
  <g transform="translate(282 373)">
    <rect class="tile" width="130" height="78" rx="12"/><rect class="icon-bg" x="12" y="13" width="34" height="34" rx="9"/>
    <path class="icon-line" d="m21 22 16 16m0-16L21 38"/><path class="icon-line" d="M19 30h20"/>
