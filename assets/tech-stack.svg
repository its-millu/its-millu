    <rect class="tile" width="130" height="78" rx="12"/><rect class="icon-bg" x="12" y="13" width="34" height="34" rx="9"/>
    <circle class="icon-line" cx="29" cy="30" r="4"/><circle class="icon-line" cx="29" cy="30" r="11"/><path class="icon-line" d="M29 19v-4m0 30v-4m11-11h4M14 30h4"/>
