<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
<title id="title">Millu's technology stack</title>
<desc id="desc">A premium animated technology toolkit covering AI and data, software and backend, and hardware and engineering.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#061512"/><stop offset=".55" stop-color="#0A2823"/><stop offset="1" stop-color="#102F2A"/>
  </linearGradient>
  <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#A1FFE1"/><stop offset=".5" stop-color="#52D9B4"/><stop offset="1" stop-color="#24A98A"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#123B33" stop-opacity=".94"/><stop offset="1" stop-color="#0A211D" stop-opacity=".96"/>
  </linearGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#6FFFD0" stop-opacity="0"/><stop offset=".5" stop-color="#6FFFD0" stop-opacity=".18"/><stop offset="1" stop-color="#6FFFD0" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="13"/>
  </filter>
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif}
    .eyebrow{font-size:14px;font-weight:800;letter-spacing:3.2px;fill:#79E8C6}
    .sub{font-size:13px;fill:#9ABDB3;letter-spacing:.25px}
    .group{font-size:12px;font-weight:800;letter-spacing:1.7px;fill:#7FE7C7}
    .name{font-size:15px;font-weight:650;fill:#E7F8F1}
    .hint{font-size:10px;letter-spacing:1.4px;fill:#719B8F}
    .panel{fill:url(#panel);stroke:#286A5B;stroke-width:1.2}
    .tile{fill:#0D3029;stroke:#286B5B;stroke-width:1}
    .icon-bg{fill:#17483D;stroke:#4BBA99;stroke-opacity:.55;stroke-width:1}
    .icon-line{fill:none;stroke:#9BFFE0;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .icon-fill{fill:#82EAC8}
    .pulse{animation:pulse 2.8s ease-in-out infinite}
    .float{animation:float 4.5s ease-in-out infinite}
    .scan{animation:scan 8s ease-in-out infinite}
    .spark{animation:spark 2.2s ease-in-out infinite}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}
    @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
    @keyframes scan{0%{transform:translateX(-1250px)}55%,100%{transform:translateX(1250px)}}
    @keyframes spark{0%,100%{opacity:.25}50%{opacity:1}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.pulse,.float,.scan,.spark,.spin{animation:none}}
  </style>
</defs>

<rect width="1200" height="510" rx="26" fill="url(#bg)"/>
<circle cx="1090" cy="65" r="120" fill="#28B894" opacity=".08" filter="url(#soft)"/>
<circle cx="80" cy="460" r="130" fill="#28B894" opacity=".06" filter="url(#soft)"/>
<g opacity=".12" stroke="#62DDB9" fill="none">
  <path d="M0 92H1200M0 490H1200M28 0V510M1172 0V510"/>
  <path d="M20 112h22m-11-11v22M1158 112h22m-11-11v22M20 474h22m-11-11v22M1158 474h22m-11-11v22"/>
</g>

<g>
  <text x="48" y="54" class="eyebrow">ENGINEERING TOOLKIT <tspan fill="#D8FFF2">/</tspan> 2026</text>
  <text x="48" y="82" class="sub">Technologies I build with, experiment on, and keep sharpening.</text>
  <g transform="translate(1000 42)">
    <circle cx="0" cy="0" r="4" fill="#68F2BE" class="pulse" filter="url(#glow)"/>
    <text x="13" y="4" class="hint">SYSTEMS ONLINE</text>
  </g>
</g>

<!-- Category panels -->
<g>
  <rect class="panel" x="38" y="112" width="1124" height="108" rx="17"/>
  <rect class="panel" x="38" y="235" width="1124" height="108" rx="17"/>
  <rect class="panel" x="38" y="358" width="1124" height="108" rx="17"/>
  <path d="M55 113h180" stroke="url(#mint)" stroke-width="3" stroke-linecap="round"/>
  <path d="M55 236h180" stroke="url(#mint)" stroke-width="3" stroke-linecap="round"/>
  <path d="M55 359h180" stroke="url(#mint)" stroke-width="3" stroke-linecap="round"/>
</g>
<g class="scan"><rect x="0" y="112" width="210" height="354" fill="url(#sweep)"/></g>

<!-- category labels -->
<g>
  <text x="58" y="140" class="group">01 / AI &amp; DATA</text>
  <text x="58" y="263" class="group">02 / SOFTWARE &amp; BACKEND</text>
  <text x="58" y="386" class="group">03 / HARDWARE &amp; ENGINEERING</text>
  <text x="58" y="202" class="hint">INTELLIGENCE</text>
  <text x="58" y="325" class="hint">APPLICATIONS</text>
  <text x="58" y="448" class="hint">REAL-WORLD SYSTEMS</text>
</g>

<!-- reusable-looking icon tiles; each has an original mini mark -->
<!-- AI & DATA -->
<g class="float">
  <g transform="translate(282 127)">
    <rect class="tile" width="130" height="78" rx="12"/><rect class="icon-bg" x="12" y="13" width="34" height="34" rx="9"/>
    <path class="icon-line" d="M21 31c-5-5 1-11 8-8 5-4 12 1 8 7 4 6-2 11-8 8-6 4-12-1-8-7Z"/>
    <path class="icon-line" d="M27 22v17m-5-9h14"/>
    <text class="name" x="55" y="35">Python</text><text class="hint" x="55" y="52">LANGUAGE</text>
  </g>
  <g transform="translate(424 127)">
    <rect class="tile" width="130" height="78" rx="12"/><rect class="icon-bg" x="12" y="13" width="34" height="34" rx="9"/>
    <path class="icon-line" d="M29 18 19 36h8l-2 8 11-18h-8l1-8Z"/>
    <text class="name" x="55" y="35">PyTorch</text><text class="hint" x="55" y="52">DEEP LEARNING</text>
  </g>
  <g transform="translate(566 127)">
    <rect class="tile" width="130" height="78" rx="12"/><rect class="icon-bg" x="12" y="13" width="34" height="34" rx="9"/>
    <circle class="icon-line" cx="29" cy="30" r="10"/><circle class="icon-line" cx="29" cy="30" r="4"/><path class="icon-line" d="M29 16v4m0 20v4m-13-14h4m18 0h4"/>
    <text class="name" x="55" y="35">OpenCV</text><text class="hint" x="55" y="52">COMPUTER VISION</text>
  </g>
  <g transform="translate(708 127)">
    <rect class="tile" width="130" height="78" rx="12"/><rect class="icon-bg" x="12" y="13" width="34" height="34" rx="9"/>
    <path class="icon-line" d="M19 22h20M19 29h20M19 36h20"/><circle class="icon-fill" cx="23" cy="22" r="2"/><circle class="icon-fill" cx="34" cy="29" r="2"/><circle class="icon-fill" cx="27" cy="36" r="2"/>
    <text class="name" x="55" y="35">NumPy</text><text class="hint" x="55" y="52">NUMERICAL</text>
  </g>
  <g transform="translate(850 127)">
    <rect class="tile" width="130" height="78" rx="12"/><rect class="icon-bg" x="12" y="13" width="34" height="34" rx="9"/>
    <path class="icon-line" d="M19 38V22h20v16M23 34l4-5 4 3 5-7"/><circle class="icon-fill" cx="36" cy="25" r="2"/>
    <text class="name" x="55" y="35">Pandas</text><text class="hint" x="55" y="52">DATA ANALYSIS</text>
  </g>
  <g transform="translate(992 127)">
    <rect class="tile" width="150" height="78" rx="12"/><rect class="icon-bg" x="12" y="13" width="34" height="34" rx="9"/>
    <path class="icon-line" d="M19 38V20h20v18M23 34l4-5 4 2 5-7"/><path class="icon-line" d="M24 24h10"/>
    <text class="name" x="55" y="35">ML</text><text class="hint" x="55" y="52">MODELS &amp; AI</text>
  </g>
</g>

<!-- SOFTWARE & BACKEND -->
<g class="float">
  <g transform="translate(282 250)">
