  </g>
  <g transform="translate(424 373)">
    <rect class="tile" width="130" height="78" rx="12"/><rect class="icon-bg" x="12" y="13" width="34" height="34" rx="9"/>
    <rect class="icon-line" x="21" y="21" width="16" height="18" rx="3"/><path class="icon-line" d="M24 17v4m5-4v4m5-4v4m-10 18v4m5-4v4m5-4v4"/>
