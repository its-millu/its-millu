<g opacity=".85">
  <path d="M48 484H1152" stroke="#2D7565" stroke-opacity=".6"/>
  <text x="48" y="499" class="hint">AI  •  SOFTWARE  •  EMBEDDED  •  AUTONOMOUS SYSTEMS</text>
  <g class="spark" fill="#79E8C6"><circle cx="1136" cy="493" r="2.5"/><circle cx="1148" cy="493" r="2.5"/></g>
</g>
<rect x="1" y="1" width="1198" height="508" rx="25" fill="none" stroke="#72E0C1" stroke-opacity=".4"/>
</svg>
