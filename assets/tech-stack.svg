    <path class="icon-line" d="m25 21-7 9 7 9m8-18 7 9-7 9"/>
    <text class="name" x="55" y="35">TypeScript</text><text class="hint" x="55" y="52">TYPED JS</text>
  </g>
  <g transform="translate(424 250)">
    <rect class="tile" width="130" height="78" rx="12"/><rect class="icon-bg" x="12" y="13" width="34" height="34" rx="9"/>
