<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
<title id="t">Millu | Intelligence in motion</title><desc id="d">Aurora Circuit themed animated banner for AI, robotics, embedded systems and UAV engineering.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090D25"/><stop offset=".55" stop-color="#15143B"/><stop offset="1" stop-color="#082D3B"/></linearGradient>
 <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#48E5FF"/><stop offset=".48" stop-color="#A78BFA"/><stop offset="1" stop-color="#FF8A72"/></linearGradient>
 <radialGradient id="orb"><stop stop-color="#8B5CF6" stop-opacity=".5"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>
 text{font-family:Inter,Segoe UI,Arial,sans-serif}.small{font-size:13px;letter-spacing:4px;font-weight:700;fill:#80E9F5}.main{font-size:78px;font-weight:900;letter-spacing:5px;fill:#F4F5FF}.sub{font-size:19px;letter-spacing:2px;fill:#B7C2E9}.micro{font-size:10px;letter-spacing:2px;fill:#91A2CE}
 .flow{stroke-dasharray:8 16;animation:flow 8s linear infinite}.scan{animation:scan 7s ease-in-out infinite}.pulse{animation:pulse 2.6s ease-in-out infinite}.orbit{transform-origin:1010px 178px;animation:spin 22s linear infinite}.float{animation:float 5s ease-in-out infinite}
 @keyframes flow{to{stroke-dashoffset:-240}}@keyframes scan{0%,8%{transform:translateX(-350px);opacity:0}20%{opacity:.5}80%{opacity:.25}100%{transform:translateX(1500px);opacity:0}}@keyframes pulse{50%{opacity:1;filter:drop-shadow(0 0 8px #48E5FF)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-7px)}}
 @media(prefers-reduced-motion:reduce){.flow,.scan,.pulse,.orbit,.float{animation:none}}
 </style>
</defs>
<rect width="1200" height="360" rx="28" fill="url(#bg)"/>
<circle cx="930" cy="90" r="210" fill="url(#orb)" filter="url(#blur)"/><circle cx="1110" cy="290" r="180" fill="#12C7D9" opacity=".10" filter="url(#blur)"/>
<g stroke="#5D6FA8" opacity=".17" fill="none"><path d="M0 65H1200M0 300H1200M42 0V360M1158 0V360"/><path d="M0 245h150l25-25h90m935-95h-120l-30 30h-80"/></g>
<g fill="none" stroke="url(#aurora)" stroke-width="2" opacity=".7"><path class="flow" d="M0 245h150l25-25h90m935-95h-120l-30 30h-80"/><path class="flow" d="M0 90h100l35 35h75m990 130h-120l-35 35h-90"/></g>
<g class="scan"><rect x="0" y="0" width="180" height="360" fill="url(#aurora)" opacity=".12"/></g>
<g transform="translate(70 75)">
 <text class="small" y="0">ENGINEERING THE POSSIBLE</text>
 <text class="main" y="104">MILLU<tspan fill="#48E5FF">.</tspan></text>
 <rect x="2" y="125" width="68" height="4" rx="2" fill="#48E5FF"/><rect x="76" y="125" width="34" height="4" rx="2" fill="#A78BFA"/><rect x="116" y="125" width="18" height="4" rx="2" fill="#FF8A72"/>
 <text class="sub" y="172">AI  /  ROBOTICS  /  EMBEDDED  /  UAV SYSTEMS</text>
 <text class="micro" y="210">IDEAS INTO INTELLIGENT, REAL-WORLD SYSTEMS</text>
</g>
<g class="float" transform="translate(1005 175)">
 <circle r="92" fill="#111B3E" stroke="#40528C" stroke-width="1.5"/>
 <circle r="74" fill="none" stroke="#48E5FF" stroke-opacity=".5" stroke-dasharray="3 9"/>
 <g class="orbit" fill="none" stroke="#A78BFA" stroke-width="2"><ellipse rx="110" ry="37"/><ellipse rx="37" ry="110" transform="rotate(55)"/></g>
 <g stroke="#DCE8FF" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#glow)">
  <path d="M-43-27 0 0 43-27M-43 27 0 0 43 27"/><circle cx="-43" cy="-27" r="13" stroke="#48E5FF"/><circle cx="43" cy="-27" r="13" stroke="#FF8A72"/><circle cx="-43" cy="27" r="13" stroke="#A78BFA"/><circle cx="43" cy="27" r="13" stroke="#B7F36B"/><rect x="-13" y="-12" width="26" height="24" rx="7" stroke="#48E5FF"/>
 </g>
 <circle r="4" fill="#fff" class="pulse"/>
</g>
<g fill="#48E5FF"><circle cx="855" cy="64" r="3" class="pulse"/><circle cx="1150" cy="75" r="2"/><circle cx="890" cy="285" r="2"/><circle cx="1100" cy="310" r="3" class="pulse"/></g>
<rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="#6F82C2" stroke-opacity=".55"/>
</svg>